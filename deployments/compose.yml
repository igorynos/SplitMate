services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/splitmate?sslmode=disable
    ports: ["18081:8080"]
    depends_on:
      postgres: {condition: service_healthy}
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: splitmate, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d splitmate"], interval: 3s, timeout: 3s, retries: 10}
    volumes: ["data:/var/lib/postgresql/data"]
volumes: {data: {}}
